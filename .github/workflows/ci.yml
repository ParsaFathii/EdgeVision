# EdgeVision — CI
# Honest pipeline: every job runs a real command that a developer can also
# run locally (see docs/DEVELOPMENT). Nothing here is decorative — no job
# claims a check that is not actually executed.
# Copyright © 2026 Parsa Fathi — Apache-2.0

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Native C++20 engine: zero external dependencies — a plain g++ build with
  # the project's zero-warning flags, then the end-to-end NDJSON smoke test
  # (the harness exits non-zero on any protocol failure).
  engine:
    name: Native engine
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      # ubuntu-latest ships g++ >= 12 (13/14 at the time of writing), which
      # already satisfies the C++20 toolchain — no apt install needed.
      - name: Show toolchain
        run: g++ --version

      - name: Build engine
        run: bash scripts/build-engine.sh

      # Runs the real binary end-to-end and validates the NDJSON protocol.
      - name: Engine smoke test
        run: python3 engine-cpp/tools/engine_smoke.py

  # Web app + REST API layer (Next.js): install with Bun, then lint.
  web:
    name: Web app (Next.js)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install

      # Lint + typecheck are the honest gates today. Deliberately NOT run in CI:
      # - `next build` needs env-specific / standalone-output wiring that a
      #   clean CI runner does not own (the orchestrator builds releases).
      # The root tsconfig only covers src/ (mini-services, examples, skills,
      # engine-cpp and the mobile/python components are excluded — each is
      # type-checked by its own runtime), so `tsc --noEmit` is a clean
      # repo-level check for the web layer.
      - name: Lint
        run: bun run lint

      - name: Typecheck
        run: bunx tsc --noEmit

  # FastAPI reference service (optional component): dependency install plus
  # a syntax-level compile check. Compile only — importing the app module
  # would require env/DB wiring that CI does not (and should not) own.
  api-python:
    name: FastAPI reference
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r services/api-python/requirements.txt

      - name: Compile check
        run: python -m compileall services/api-python

  # Flutter client (optional component): static analysis only. Full widget
  # tests / device runs are future work and are honestly not part of this
  # gate yet.
  mobile:
    name: Flutter client
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Pub get
        run: cd mobile && flutter pub get

      - name: Analyze
        run: cd mobile && flutter analyze
